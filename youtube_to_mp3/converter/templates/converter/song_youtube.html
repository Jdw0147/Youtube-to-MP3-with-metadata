<!--
Form for downloading a song from YouTube and editing its metadata.
-->

{% load static %}

<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'converter/style.css' %}">
    <title>Download from YouTube</title>
</head>
<body>
    <h1>Download from YouTube</h1>
    {% if success %}
        <p style="color:green;">Song downloaded and metadata saved! Output file: {{ output_file }}</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Download & Save</button>
    </form>
    <a href="{% url 'home' %}">Back to Home</a>

    <script src="{% static 'converter/cover_preview.js' %}"></script>
</body>
</html>
